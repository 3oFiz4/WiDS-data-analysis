- id: I3
  status: 'TRUE'
  hypothesis:
    polarity: +
    claim: Across 64 matched (h1_, d1_) pairs, h1_ features exhibit >= 5.0 pp higher
      median missingness than d1_ twins, concentrating >= 60% of >50%-missing cols
      in h1_/blood gas.
  methodology:
    technique: Domain/window taxonomy mapping and one-sided paired Wilcoxon signed-rank
      test
    parameters:
      matched_pairs_n: 64
      alpha: 0.01
      alternative: greater
    assumptions:
    - Each h1_<stem> pairs 1-to-1 with d1_<stem>.
    missing_data_policy: Explicit null rate over full Train and Unlabeled tables.
    script_ref: scripts/stage1_schema_and_sparsity.py
  evidence:
    type: N
    metric: n_pairs=64, med_delta_tr=17.77pp (p=3.772e-12), conc_tr=71.23%, med_delta_te=18.82pp
      (p=3.772e-12), conc_te=70.27%
    formula: median(miss(h1)-miss(d1)); |{c in (h1_ U blood_gas):miss>50%}| / |{c:miss>50%}|
  condition:
    timeframe: Static WiDS Datathon 2021 dataset snapshot
    filters:
    - 64 matched (h1_, d1_) pairs and all 180 shared predictors
  verdict:
    outcome: 'TRUE'
    'true': median_delta >= 5.0 AND p < 0.01 AND conc >= 60% in BOTH splits
    'false': median_delta <= 0 OR p >= 0.05 OR conc < 40% in EITHER split
    inconclusive: Borderline concentration or p-value
  action:
    on_true: 'Reject blind >80%-null dropping; retain h1_/blood-gas for MNAR testing;
      Spawns #I3.1.'
    on_false: 'Audit alternative sparsity drivers and Spawns #I3.1.'
    on_inconclusive: 'Inspect borderline pairs and Spawns #I3.1.'
  source:
    file: data/raw/DataDictionaryWiDS2021.csv (sha256=84fc9c3603d4d7a5b9afc4af19d945a292ba124a150b4a3507506f7e3140b860);
      data/raw/TrainingWiDS2021.csv
    version:
      commit: 9faf954
      sha256: ca65bf5c36cafa9788f06d09e7fb66831dc88cde725e1fdc3a80e707e2cf893b
    columns:
    - 64 h1_* and 64 d1_* columns; labs blood gas
    extraction:
      script: scripts/stage1_schema_and_sparsity.py
      timestamp: '2026-11-19T06:36:10+08:00'
